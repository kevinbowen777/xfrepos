[project]
name = "xfrepos"
version = "0.9.0"
description = "A collection of scripts to maintain local Xfce repositories"
requires-python = ">=3.12.0, <3.15.0"
dependencies = []
authors = [
    { name = "Kevin Bowen", email = "kevin.bowen@gmail.com" }
]
maintainers = [
]
license = { text = "GPL-2.0-only" }
readme = "README.md"
keywords = ["xfce","cli-application","repository management",]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
]

package-mode = true

[project.urls]
Homepage = "https://github.com/kevinbowen777/xfrepos.git"
Changelog = "https://github.com/kevinbowen777/xfrepos/NEWS"
Repository = "https://github.com/kevinbowen777/xfrepos.git"
Documentation = "file:///docs/index.rst"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=4.0, <5.0"
ruff = ">=0.8, <1.0"
nox = "2026.8.17"
pytest = ">=9.0, <10.0"
pytest-cov = ">=7.1.0, <8.0"
pytest-sugar = "1.1.1"
coverage = { version = ">=7.0.0, <8.0.0", extras = ["toml"] }
sphinx = ">= 9.1.0, <10.0"

[tool.coverage.run]
branch = true
# dynamic_context = "test_function"
source = ["src"]
omit = [
    "*/__init__.py",
    "*tests/*",
    "*test_*.py",
    "*tests.py",
]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
# show_contexts = true
title = "xfrepos coverage report"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = "src"
filterwarnings = [ ]

[tool.ruff]
preview = true
respect-gitignore = true
unsafe-fixes = false

# Same as Black.
line-length = 88

# Assume Python 3.13.x
target-version = "py314"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".nox",
    ".ruff_cache",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
    "B",    # flake8-bugbear
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "S",    # flake8-bandit
    "W",    # pycodestyle warnings
    "RUF",  # ruff checks
]

ignore = [
    "line-too-long",    # line too long ({width} > {limit} characters) [E501]
    "module-import-not-at-top-of-file",    # module level import not at top of file [E402]
    "bare-except",    # do not use bare except [E722]
    "ERA",     # do not autoremove commented out code [ERA]
    "non-empty-init-module",
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# "src/test.py" = ["S101", "S106"]
# "src/build_xfce.py" = ["S605", "S607"]
# "src/clean_xfce.py" = ["S605", "S607"]
# "src/clone_xfce.py" = ["S404", "S603", "S607"]
# "src/install_xfce.py" = ["S605", "S607"]
# "src/pull_xfce.py" = ["S605", "S607"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, repspect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[build-system]
# requires = ["setuptools", "wheel"]
# build-backend = "setuptools.build_meta"
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
