[project]
name = "xfrepos"
version = "0.10.0"
description = "A collection of scripts to maintain local Xfce repositories"
requires-python = ">=3.12.0, <3.16.0"
dependencies = []
authors = [
    { name = "Kevin Bowen", email = "kevin.bowen@gmail.com" }
]
maintainers = [
]
license = { text = "GPL-2.0-only" }
readme = "README.md"
keywords = ["xfce","cli-application","repository management",]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
]

package-mode = true

[project.urls]
Homepage = "https://github.com/kevinbowen777/xfrepos.git"
Changelog = "https://github.com/kevinbowen777/xfrepos/CHANGELOG.rst"
Repository = "https://github.com/kevinbowen777/xfrepos.git"
Documentation = "https://github.com/kevinbowen777/xfrepos/README.md"

[tool.poetry.group.dev.dependencies]
pre-commit = "4.7.0"
ruff = "0.17.6"
nox = "2026.10.20"
pytest = "9.2.0"
pytest-cov = "7.1.0"
pytest-sugar = "1.1.1"
coverage = { version = "7.17.4", extras = ["toml"] }
towncrier = "26.9.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = "1.10.1"

[tool.coverage.run]
branch = true
# dynamic_context = "test_function"
source = ["src"]
omit = [
    "*/__init__.py",
    "*tests/*",
    "*test_*.py",
    "*tests.py",
]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
# show_contexts = true
title = "xfrepos coverage report"

[tool.pyright]
# See: https://github.com/microsoft/pyright/blob/main/docs/configuration.md
include = [
    "src",
]
exclude = [
    "**/__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".nox",
]
ignore = ["docs/html"]
defineConstant = { DEBUG = true }
stubPath = ""

# The following may need to be modified when collaborating with others
venv = "xfrepos-0wHYlrJ7-py3.15"
venvPath = "../../../python/venvs/"
# More portable venv config
# venvPath = "."
# venv = ".venv"

typeCheckingMode = "basic"
useLibraryCodeForTypes = true
strictListInference = true
strictDictionaryInference = true
reportConstantRedefinition = "error"
reportOptionalCall = "error"
reportOptionalContextManager = "error"
reportOptionalIterable = "error"
reportOptionalMemberAccess = "error"
reportMissingImports = true
reportOptionalOperand = "error"
reportOptionalSubscript = "error"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "error"
reportUnnecessaryTypeIgnoreComment = "warning"

pythonVersion = "3.15"
pythonPlatform = "Linux"

executionEnvironments = [
  { root = ".", pythonVersion = "3.15", extraPaths = [ "src", "tests" ] },
]

[tool.pytest.ini_options]
# PYTHONWARNINGS="always"
addopts = [
    "--import-mode=importlib",
]
python_files = ["test_*.py"]
pythonpath = "src"
filterwarnings = [
]

[tool.ruff]
preview = true
respect-gitignore = true
unsafe-fixes = false

# Same as Black.
line-length = 88

# Assume Python 3.15.x
target-version = "py315"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".nox",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
# select = [...] See the https://docs.astral.sh/ruff/default-rules/
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "FURB",     # Suggest more idiomatic Python patterns
]

ignore = [
    "line-too-long",    # line too long ({width} > {limit} characters) [E501]
    "module-import-not-at-top-of-file",    # module level import not at top of file [E402]
    "bare-except",    # do not use bare except [E722]
    "ERA",     # do not autoremove commented out code [ERA]
    "non-empty-init-module",
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[\\p{XID_Continue}]*[\\p{XID_Continue}--_]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, repspect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.towncrier]
directory = "changelog/"
filename = "CHANGELOG.rst"

title_format = "xfrepos {version} ({project_date})"
issue_format = "`#{issue} <https://github.com/kevinbowen777/xfrepos/issues/{issue}>`_"
template = "changelog/_template.rst"

[[tool.towncrier.type]]
# Declarations of future API removals and breaking changes in behavior.
directory = "deprecation"
name = "Deprecations (removal in next major release)"
showcontent = true

[[tool.towncrier.type]]
# New behaviors, public APIs, etc.
directory = "feature"
name = "New features"
showcontent = true

[[tool.towncrier.type]]
# Something we deemed an improper undesired behavior that got corrected
# in the release to match pre-agreed expectations.
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
# Stuff that affects security. e.g. updating packages,
directory = "security"
name = "Security updated"
showcontent = true

[[tool.towncrier.type]]
# Notable updates to the documentation structure or build process.
directory = "doc"
name = "Improved documentation"
showcontent = true

[[tool.towncrier.type]]
# Changes that affects the contributor experience. e.g. running tests,
# building the docs, setting up the development environment.
directory = "contrib"
name = "Contributor-facing changes"
showcontent = true

[[tool.towncrier.type]]
# Changes that are hard to assign to any of the above categories.
directory = "misc"
name = "Miscellaneous internal changes"
showcontent = true

[[tool.towncrier.type]]
# Updates regarding bundling dependencies
directory = "vendor"
name = "Vendored libraries"
showcontent = true

[build-system]
# requires = ["setuptools", "wheel"]
# build-backend = "setuptools.build_meta"
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
